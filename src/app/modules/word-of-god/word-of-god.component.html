<main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
  <section>
    <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6">
      Word of God
    </h2>

    <!-- Tabs -->
     <div class="w-full flex justify-end mb-4">
  <a
    routerLink="/word-of-god/bookmarks"
    class="px-4 py-2 rounded-lg bg-white border hover:bg-gray-50 text-sm">
    View Bookmarks
  </a>
</div>

    <div class="tabs-wrap">
      <div class="tabs-card">
        <button
          type="button"
          (click)="activeTab = 'homilies'"
          class="word-tab"
          [class.active]="activeTab === 'homilies'"
        >
          📖 Homilies
        </button>

        <button
          type="button"
          (click)="activeTab = 'gospel'"
          class="word-tab"
          [class.active]="activeTab === 'gospel'"
        >
          ✝️ Gospel Readings
        </button>
      </div>
    </div>

    <!-- Content -->
    <app-homilies *ngIf="activeTab === 'homilies'"></app-homilies>
    <app-gospel *ngIf="activeTab === 'gospel'"></app-gospel>
  </section>
</main>
